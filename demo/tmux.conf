# tmux config for the demo server started by start.sh: tmux defaults plus
# tmux-scp, a blue status line, and nothing from your own ~/.tmux.conf.
set -g default-terminal tmux-256color
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g status-style bg=blue,fg=white
set -g status-left "#S  "
set -g status-right " %R"
set -g pane-border-style fg=blue
set -g pane-active-border-style fg=blue

run-shell "$TMUX_SCP_REPO/tmux-scp.tmux"
